name: Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Build Image
      working-directory: project
      run: |
        podman build -t podman.azurecr.io/podman:${{ github.run_id }} -f Containerfile .

    - name: Docker login and push 
      run: |
        podman login podman.azurecr.io -u podman -p ${{ secrets.ACR_PASSWD }}
        podman push podman.azurecr.io/podman:${{ github.run_id }}
        
    - name: Login to Azure
      run: |
       az login --service-principal -u ${{ secrets.clientid }} -p ${{ secrets.clientsecret }} --tenant ${{ secrets.tenantid }}
       az account set --subscription "8da5ea31-eccb-4d99-8a1a-437ea5504220"
       
    - name: Deploy Container App
      run: |
        az containerapp update \
          --name app-deploy \
          --resource-group sharnitha-poc \
          --image podman.azurecr.io/podman:${{ github.run_id }}
